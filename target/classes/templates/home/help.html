<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/main}" lang="vi">

<head>
	<title th:text="${title} ?: 'Trợ giúp'">Trợ giúp</title>
</head>

<body>
	<div layout:fragment="content">
		<section class="container py-5">
			<div class="page-header mb-4">
				<h1 class="page-title" th:text="${title}">Trợ giúp</h1>
				<p class="text-muted">Chúng tôi luôn sẵn sàng hỗ trợ bạn</p>
			</div>
			<div class="row g-4">
				<div class="col-md-6">
					<div class="card-soft h-100">
						<div class="icon-circle"><i data-lucide="phone"></i></div>
						<h5>Hotline</h5>
						<p class="mb-0">1900 0000 — Hỗ trợ 24/7</p>
					</div>
				</div>
				<div class="col-md-6">
					<div class="card-soft h-100">
						<div class="icon-circle"><i data-lucide="mail"></i></div>
						<h5>Email</h5>
						<p class="mb-0">support@vietnambus.vn</p>
					</div>
				</div>
			</div>
		</section>
	</div>
</body>

</html>

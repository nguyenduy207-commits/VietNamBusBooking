<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="vi">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Vietnam Bus Booking - Đặt vé xe khách trực tuyến, nhanh chóng và tiện lợi">

	<!-- Title pattern: PageTitle - Vietnam Bus Booking -->
	<title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Vietnam Bus Booking</title>

	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
		rel="stylesheet">

	<!-- Bootstrap 5 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- App CSS -->
	<link rel="stylesheet" th:href="@{/css/style.css}">

	<!-- Lucide Icons -->
	<script src="https://unpkg.com/lucide@latest"></script>

	<!-- Page-specific <head> content -->
	<th:block layout:fragment="head-extra"></th:block>
</head>

<body>

	<!-- Header / Navbar -->
	<div th:replace="~{fragments/header :: navbar}"></div>

	<!-- Page main content -->
	<main class="page-main">
		<th:block layout:fragment="content"></th:block>
	</main>

	<!-- Footer -->
	<div th:replace="~{fragments/footer :: footer}"></div>

	<!-- Common scripts (Bootstrap, main.js, lucide init) -->
	<th:block th:replace="~{fragments/footer :: scripts}"></th:block>

	<!-- Page-specific scripts -->
	<th:block layout:fragment="scripts-extra"></th:block>
</body>

</html>
